<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startpage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <!-- Sección izquierda: saludo + búsqueda -->
      <section class="left-section">
        <h1><span>ok</span>alexiiis</h1>
        <p>What do you want today?</p>
        <form action="https://duckduckgo.com/" method="GET" class="search-form">
          <span class="prompt">❯</span>
          <input
            type="text"
            name="q"
            class="search-input"
            placeholder="Search DuckDuckGo..."
            autofocus
          />
        </form>
      </section>

      <!-- Sección derecha: bookmarks -->
      <section class="right-section">
        <div class="bookmark-category">
          <h3>social</h3>
          <div class="bookmark-list">
            <a href="https://linkedin.com" class="bookmark-link">linkedin</a>
            <a href="https://instagram.com" class="bookmark-link">instagram</a>
            <a href="https://youtube.com" class="bookmark-link">youtube</a>
            <a href="https://discord.com" class="bookmark-link">discord</a>
            <a href="https://reddit.com/r/unixporn" class="bookmark-link"
              >r/unixporn</a
            >
          </div>
        </div>
        <div class="bookmark-category">
          <h3>dev</h3>
          <div class="bookmark-list">
            <a href="https://gmail.com" class="bookmark-link">gmail</a>
            <a href="https://claude.ai/" class="bookmark-link">claude</a>
            <a href="https://chatgpt.com" class="bookmark-link">gpt</a>
          </div>
        </div>
        <div class="bookmark-category">
          <h3>others</h3>
          <div class="bookmark-list">
            <a href="https://monkeytype.com" class="bookmark-link"
              >monkeytype</a
            >
            <a href="https://www.chess.com/home" class="bookmark-link">chess</a>
            <a href="https://aniwatchtv.to/home" class="bookmark-link">anime</a>
            <a href="https://www.cineby.app/" class="bookmark-link">netflix</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
